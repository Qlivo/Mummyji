<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Qlivo Apparels</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #080808;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 18px;
    }

    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }


    /* =========================
       BRAND
    ========================= */

    .brand {
      font-family: "HK Modular", "Arial Black", sans-serif;

      font-size: clamp(42px, 10vw, 76px);
      font-weight: 900;

      letter-spacing: -4px;
      line-height: 1;

      margin-bottom: 32px;

      color: #ffffff;
    }

    .brand span {
      color: #777777;
    }


    /* =========================
       VIDEO
    ========================= */

    .video-wrapper {
      position: relative;

      width: 100%;

      aspect-ratio: 9 / 16;

      background: #111111;

      border-radius: 26px;

      overflow: hidden;

      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 25px 70px rgba(0,0,0,0.65);
    }

    video {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      background: #000000;
    }


    /* =========================
       END SCREEN
    ========================= */

    .end-screen {
      position: absolute;

      inset: 0;

      background: #080808;

      display: none;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      gap: 30px;

      z-index: 20;

      animation: fadeIn 0.55s ease;
    }


    /* =========================
       END LOGO
    ========================= */

    .end-logo {
      font-family: "HK Modular", "Arial Black", sans-serif;

      font-size: clamp(65px, 17vw, 115px);

      font-weight: 900;

      letter-spacing: -6px;

      line-height: 1;

      color: #ffffff;

      text-shadow:
        0 0 30px rgba(255,255,255,0.08);
    }


    /* =========================
       OPEN QLIVO BUTTON
    ========================= */

    .open-qlivo {
      width: min(270px, 76%);

      padding: 17px 24px;

      display: flex;

      justify-content: center;

      align-items: center;

      background: #050505;

      color: #ffffff;

      border: 2px solid #ffffff;

      border-radius: 18px;

      text-decoration: none;

      font-size: 17px;

      font-weight: 600;

      letter-spacing: 0.3px;

      transition:
        background 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;
    }

    .open-qlivo:hover {
      background: #ffffff;

      color: #000000;

      transform: translateY(-3px);
    }

    .open-qlivo:active {
      transform: scale(0.97);
    }


    /* =========================
       INSTAGRAM
    ========================= */

    .social {
      margin-top: 27px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      color: #ffffff;

      text-decoration: none;

      font-size: 17px;

      font-weight: 600;

      transition: opacity 0.2s ease;
    }

    .social:hover {
      opacity: 0.7;
    }


    /* Instagram Icon */

    .instagram {
      width: 24px;
      height: 24px;

      border: 2px solid #ffffff;

      border-radius: 7px;

      position: relative;
    }

    .instagram::before {
      content: "";

      position: absolute;

      width: 8px;
      height: 8px;

      border: 2px solid #ffffff;

      border-radius: 50%;

      top: 5px;
      left: 5px;
    }

    .instagram::after {
      content: "";

      position: absolute;

      width: 3px;
      height: 3px;

      background: #ffffff;

      border-radius: 50%;

      top: 3px;
      right: 3px;
    }


    /* =========================
       LINKS
    ========================= */

    .links {
      margin-top: 14px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      gap: 18px;

      font-size: 14px;
    }

    .links a {
      color: #777777;

      text-decoration: none;

      transition: color 0.2s ease;
    }

    .links a:hover {
      color: #ffffff;
    }


    /* =========================
       ANIMATION
    ========================= */

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: scale(0.98);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {
        padding: 35px 14px;
        align-items: flex-start;
      }

      .container {
        max-width: 500px;
      }

      .brand {
        margin-bottom: 25px;
      }

      .video-wrapper {
        border-radius: 21px;
      }

      .social {
        margin-top: 23px;
      }

      .links {
        flex-direction: column;
        gap: 7px;
      }

    }

  </style>
</head>


<body>

  <main class="container">


    <!-- =========================
         BRAND
    ========================= -->

    <div class="brand">
      Qlivo <span>Apparels</span>
    </div>


    <!-- =========================
         VIDEO PLAYER
    ========================= -->

    <div class="video-wrapper">

      <video
        id="qlivoVideo"
        controls
        playsinline
        preload="metadata">

        <source src="video.mp4" type="video/mp4">

        Your browser does not support video playback.

      </video>


      <!-- =========================
           VIDEO END SCREEN
      ========================= -->

      <div
        class="end-screen"
        id="endScreen">


        <div class="end-logo">
          Qlivo
        </div>


        <a
          href="https://qlivo.in"
          class="open-qlivo"
          target="_blank"
          rel="noopener noreferrer">

          Open Qlivo

        </a>


      </div>

    </div>


    <!-- =========================
         INSTAGRAM
    ========================= -->

    <a
      class="social"
      href="https://instagram.com/qlivoapparels"
      target="_blank"
      rel="noopener noreferrer">

      <div class="instagram"></div>

      @qlivoapparels

    </a>


    <!-- =========================
         WEBSITE + EMAIL
    ========================= -->

    <div class="links">

      <a
        href="https://qlivo.in"
        target="_blank"
        rel="noopener noreferrer">

        qlivo.in

      </a>


      <a
        href="mailto:qlivo.in@gmail.com">

        qlivo.in@gmail.com

      </a>

    </div>


  </main>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const video = document.getElementById("qlivoVideo");

    const endScreen = document.getElementById("endScreen");


    /*
      When the video finishes,
      show the Qlivo end screen.
    */

    video.addEventListener("ended", function () {

      endScreen.style.display = "flex";

    });


    /*
      If the user plays the video again,
      hide the end screen.
    */

    video.addEventListener("play", function () {

      endScreen.style.display = "none";

    });

  </script>

</body>
</html>
